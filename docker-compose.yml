# Local Postgres for exercising the Postgres config-store backend.
#
#   docker compose up -d
#   export MURTAUGH_TEST_POSTGRES_DSN='postgres://murtaugh:murtaugh@localhost:5433/murtaugh?sslmode=disable'
#   go test ./internal/config/store/...
#   docker compose down
#
# The Postgres integration tests skip themselves when MURTAUGH_TEST_POSTGRES_DSN
# is unset, so the default `go test ./...` never needs this container.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: murtaugh
      POSTGRES_PASSWORD: murtaugh
      POSTGRES_DB: murtaugh
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U murtaugh"]
      interval: 2s
      timeout: 5s
      retries: 15
