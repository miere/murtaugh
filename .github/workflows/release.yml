name: Release

on:
  push:
    tags: ["v*", "[0-9]*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"
  # Every binary ships on every target, each in its own tarball.
  BINARIES: murtaugh-gateway murtaugh-client

jobs:
  build:
    strategy:
      matrix:
        include:
          - target: aarch64-apple-darwin
            runner: macos-14
          - target: x86_64-apple-darwin
            runner: macos-14
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
    runs-on: ${{ matrix.runner }}
    # The signing certificate's secrets live in this environment.
    environment: release
    steps:
      - uses: actions/checkout@v4
      - name: Let Cargo fetch the private RAX crates
        env:
          RAX_READ_TOKEN: ${{ secrets.RAX_READ_TOKEN }}
        run: |
          test -n "$RAX_READ_TOKEN" || { echo "::error::Set the RAX_READ_TOKEN secret: a token that can read miere/rax-rs"; exit 1; }
          git config --global url."https://x-access-token:${RAX_READ_TOKEN}@github.com/miere/".insteadOf "https://github.com/miere/"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Build
        run: |
          export MURTAUGH_VERSION="${GITHUB_REF_NAME#v}"
          for binary in $BINARIES; do
            cargo build --release --locked --target ${{ matrix.target }} -p "$binary"
          done
      - name: Sign the macOS binaries
        if: endsWith(matrix.target, 'apple-darwin')
        env:
          P12_B64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          P12_PW: ${{ secrets.MACOS_CERT_PASSWORD }}
          # The identifier and the leaf both end up inside every user's stored
          # TCC grant. Changing either one invalidates every existing grant at
          # once, so treat them as permanent. Each binary has its own
          # identifier under the same certificate.
          SIGN_LEAF_SHA1: 08e8006e09132416a8fa6f105c0a2a9d4785283c
        run: |
          for binary in $BINARIES; do
            case "$binary" in
              murtaugh-gateway) identifier=dev.murtaugh.gateway ;;
              murtaugh-client) identifier=dev.murtaugh.client ;;
              *) echo "::error::No signing identifier for $binary"; exit 1 ;;
            esac
            SIGN_IDENTIFIER="$identifier" scripts/sign-macos.sh "target/${{ matrix.target }}/release/$binary"
          done
      - name: Package
        run: |
          for binary in $BINARIES; do
            name="$binary-$GITHUB_REF_NAME-${{ matrix.target }}"
            mkdir -p "dist/$name"
            cp "target/${{ matrix.target }}/release/$binary" README.md "dist/$name/"
            tar -C dist -czf "dist/$name.tar.gz" "$name"
            (cd dist && shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256")
          done
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/*.tar.gz*

  publish:
    needs: build
    # A `-dryrun` tag exercises the build and signing without publishing a
    # release that the update check would pick up as the latest.
    if: ${{ !endsWith(github.ref_name, '-dryrun') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes
          fi
