name: Container

# Builds the gateway image from a published release's Linux binary and checks that it starts.
# A branch push only builds. A release publishes: the Release workflow calls this one once
# the binaries are up, and a manual run with `push` republishes any existing tag.
on:
  push:
    # Without this a tag push would run it too, since path filters only apply to branches.
    branches: ["**"]
    paths:
      - "container/**"
      - ".github/workflows/container.yml"
  workflow_call:
    inputs:
      version:
        description: "Release tag to build against"
        type: string
        required: true
      push:
        description: "Push the image to ghcr.io"
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      version:
        description: "Release tag to build against (defaults to the latest release)"
        required: false
      push:
        description: "Push the image to ghcr.io"
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Resolve version and tags
        id: meta
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          latest="$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName -q .tagName)"
          version="${INPUT_VERSION:-$latest}"
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          {
            echo "version=$version"
            echo "tags<<EOF"
            echo "$image:$version"
            # Only the newest release moves `latest`, so republishing an old tag leaves it alone.
            if [ "$version" = "$latest" ]; then echo "$image:latest"; fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: container
          load: true
          tags: murtaugh:smoke
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            REPO=${{ github.repository }}
          secrets: |
            gh_token=${{ github.token }}
      - name: Check the gateway starts
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          reported="$(docker run --rm murtaugh:smoke version)"
          echo "$reported"
          case "$reported" in
            *"${VERSION#v}"*) ;;
            *) echo "::error::The image reports '$reported', expected ${VERSION#v}"; exit 1 ;;
          esac
      - uses: docker/login-action@v3
        if: inputs.push
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      # Same build as above, so this comes straight out of the builder's cache.
      - name: Push image
        if: inputs.push
        uses: docker/build-push-action@v6
        with:
          context: container
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            REPO=${{ github.repository }}
          secrets: |
            gh_token=${{ github.token }}
