name: CI

# Gate every pull request on the same checks we run locally: formatting, vet,
# a clean build, and the race-enabled test suite. Also runs on pushes to main
# so the trunk is always known-green even when a change lands without a PR.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A new push to a PR supersedes the previous run; cancel the stale one so we do
# not pay for checks on commits the author has already replaced.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Format, vet, build & test
    runs-on: ubuntu-latest
    # A Postgres service backs the config-store integration tests. They skip
    # themselves unless MURTAUGH_TEST_POSTGRES_DSN is set (below), so the SQLite
    # path stays the default everywhere else; here we point them at this service.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: murtaugh
          POSTGRES_PASSWORD: murtaugh
          POSTGRES_DB: murtaugh
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U murtaugh"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify gofmt formatting
        run: |
          set -euo pipefail
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "::error::The following files are not gofmt-formatted. Run 'gofmt -w .':"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: Architecture guards
        # Type-precise go/analysis passes enforcing structural invariants the
        # compiler can't: no downstream reads of config.AgentProfile.WorkDir (the
        # validated-core rule; see specs-wip/017), and no clock inside a
        # chatRenderer implementation (liveness belongs at the inbound event edge;
        # see AGENTS.md, "The renderer sees no clock").
        run: go run ./cmd/archcheck ./...

      # #170 Change E: the gateway must be INCAPABLE of serving an AI-backed
      # request, which is a property of its whole import closure and so cannot be
      # a go/analysis pass (those run per package). `go list -deps` computes the
      # closure; this greps it.
      #
      # The `if` form is mandatory. A pipeline ending in `grep … && exit 1` also
      # fails in the CLEAN case, because the pipeline's status is grep's
      # non-match status — and a guard that fails when nothing is wrong gets
      # disabled within a week.
      #
      # The pattern is generated from internal/archtest/reachability.Forbidden;
      # TestTheCommittedCIStepMatchesTheRule fails if this copy drifts from it.
      - name: Gateway reachability rule
        run: |
          set -euo pipefail
          forbidden='^(github\.com/miere/murtaugh/internal/agentbuild|github\.com/miere/murtaugh/internal/llm|github\.com/miere/murtaugh/internal/agent/acp|github\.com/miere/murtaugh/internal/agent/native|github\.com/miere/murtaugh/internal/agent/claudecode)$'
          # Listed into a variable first, so `set -e` catches a `go list` that
          # exits non-zero — an unresolvable import path, a missing package.
          # Inside the pipeline that failure would be indistinguishable from
          # grep's "no match" and the guard would report clean. (It does NOT
          # extend to code that will not compile: `go list -deps` prints the
          # whole closure and exits 0 through a syntax error or a type error.
          # The Build step below is what catches those.)
          deps="$(go list -deps ./cmd/murtaugh-gateway)"
          if reached="$(printf '%s\n' "$deps" | grep -E "$forbidden")"; then
            echo "::error::the gateway binary reaches a package it must not:"
            echo "$reached"
            exit 1
          fi

      - name: Build
        run: go build ./...

      # The Firestore backend and its leader lease are integration-tested against
      # the emulator, and skip themselves when FIRESTORE_EMULATOR_HOST is unset —
      # so without this step they would silently not run here at all. It is a
      # step rather than a `services:` container because service containers
      # cannot override the image's command, and this image's default entrypoint
      # is a shell.
      - name: Start the Firestore emulator
        run: |
          set -euo pipefail
          docker run -d --name firestore-emulator -p 8579:8579 \
            gcr.io/google.com/cloudsdktool/google-cloud-cli:emulators \
            gcloud emulators firestore start --host-port=0.0.0.0:8579
          for i in $(seq 1 60); do
            if curl -sf -m 2 http://127.0.0.1:8579/ >/dev/null; then
              echo "emulator ready after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "::error::the Firestore emulator did not become ready"
          docker logs firestore-emulator
          exit 1

      - name: Test (race detector)
        env:
          MURTAUGH_TEST_POSTGRES_DSN: postgres://murtaugh:murtaugh@localhost:5432/murtaugh?sslmode=disable
          FIRESTORE_EMULATOR_HOST: 127.0.0.1:8579
        run: go test -race ./...

  macos-installer-tests:
    name: macOS installer tests
    runs-on: macos-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # The install/macos suite skips on non-darwin runners (the installer is
      # macOS-only), so the ubuntu job above never exercises it. Run it here on
      # macOS where the bash installer and `murtaugh setup` actually execute.
      - name: Test installer
        run: go test ./install/...
