[package]
name = "murtaugh-client"
description = "A person's own client for Murtaugh's RAX API, such as an editor's ACP bridge"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "murtaugh-client"
path = "src/main.rs"

[dependencies]
murtaugh-common.workspace = true
rax.workspace = true
rax-tokio.workspace = true
agent-client-protocol = "=2.1.0"
clap.workspace = true
rmcp = { version = "3.5", default-features = false, features = ["client", "transport-child-process", "transport-streamable-http-client-reqwest"] }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["io-std", "process"] }
toml.workspace = true
tracing.workspace = true
url.workspace = true

[dev-dependencies]
axum.workspace = true
rmcp = { version = "3.5", default-features = false, features = ["server", "transport-streamable-http-server"] }
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
tokio-util.workspace = true

[lints]
workspace = true
