[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"

[workspace.dependencies]
rax = { git = "https://github.com/miere/rax-rs", tag = "0.5.0" }
rax-tokio = { git = "https://github.com/miere/rax-rs", tag = "0.5.0" }
rax-sim = { git = "https://github.com/miere/rax-rs", tag = "0.5.0" }
murtaugh-slack = { path = "crates/murtaugh-slack" }
murtaugh-store = { path = "crates/murtaugh-store" }
slack-sim = { path = "crates/slack-sim" }
async-trait = "0.1"
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "ws", "json", "query", "form", "multipart"] }
base64 = "0.22"
dotenvy = "0.15"
clap = { version = "4", features = ["derive"] }
gcp_auth = "0.12"
futures-util = { version = "0.3", default-features = false, features = ["std", "sink"] }
hex = "0.4"
rand = "0.10"
reqwest = { version = "0.13", default-features = false, features = ["json", "multipart", "rustls"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
semver = "1"
sha2 = "0.10"
subtle = "2"
tempfile = "3"
toml = "1"
thiserror = "2"
time = { version = "0.3", features = ["serde-well-known"] }
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "rt", "rt-multi-thread", "sync", "time"] }
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-webpki-roots"] }
tokio-util = { version = "0.7", features = ["rt"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "json", "std", "env-filter"] }
ureq = { version = "3", default-features = false, features = ["rustls", "json"] }
url = "2"
